<!DOCTYPE html>
<!--
  AI Context
  -----------
  本文件是什么: 捏脸分享二维码的官网入口，校验分享码后唤起 App。

  关联文件:
  - 上游: Android CustomizationShareLink — 生成 /f/?c=<code> 二维码链接
  - 下游: redirect.js — 执行纯函数校验并构造固定 App 深链

  核心概念:
  - 短入口: 尝试唤起 App，并保留可点击的重试和下载入口
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#06142f">
  <title>打开月光茧捏脸分享</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      background: #06142f;
      color: #f6fbff;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 50% 20%, rgba(111, 160, 214, 0.28), transparent 42%),
        #06142f;
    }
    main {
      width: min(100%, 420px);
      padding: 32px 28px;
      border: 1px solid rgba(220, 240, 255, 0.3);
      border-radius: 24px;
      background: rgba(130, 174, 230, 0.12);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.28);
      text-align: center;
    }
    h1 { margin: 0 0 12px; font-size: 24px; font-weight: 500; }
    p { margin: 0; color: rgba(236, 247, 255, 0.78); line-height: 1.7; }
    a {
      display: inline-block;
      margin-top: 24px;
      color: #c7e5ff;
      text-underline-offset: 4px;
    }
    [hidden] { display: none !important; }
    .open-app {
      display: block;
      padding: 14px 20px;
      border-radius: 12px;
      background: #c7e5ff;
      color: #06142f;
      font-weight: 600;
      text-decoration: none;
    }
  </style>
<link rel="stylesheet" href="../app-ui.css?v=20261020n">
<script src="../title-plates.js?v=20261020n" defer></script>
</head>
<body>
  <main>
    <h1>打开月光茧捏脸分享</h1>
    <p id="status" role="status" aria-live="polite">正在尝试打开 App…</p>
    <a id="open-app" class="open-app" hidden>在 App 中打开</a>
    <a id="download-app" href="https://releases.lunakoru.com/" hidden>还没有 App？下载月光茧</a>
    <a href="../">返回月光茧官网</a>
    <noscript><p>请启用 JavaScript 后重新打开此链接。</p></noscript>
  </main>

  <script src="redirect.js"></script>
  <script>
    (function openShareInApp() {
      const status = document.getElementById("status");
      const helper = window.FaceShareRedirect;
      const target = helper && helper.resolveRedirectTarget(window.location.search);

      if (!target) {
        document.querySelector("h1").textContent = "无法打开捏脸分享";
        status.textContent = "分享链接缺少有效的分享码，请向分享者重新获取二维码。";
        return;
      }

      document.getElementById("open-app").href = target;
      document.getElementById("open-app").hidden = false;
      document.getElementById("download-app").hidden = false;
      status.textContent = "若没有自动进入 App，请点击下方按钮。";
      window.location.href = target;
    })();
  </script>
</body>
</html>
